# The checks every pull request must pass, and the wider ones a release must pass.
#
# CONTRIBUTING.md lists the same checks to run by hand. This file runs them on every pull request
# and every push to main, so a stale generated file, a broken install or a skipped browser test
# cannot reach a release unnoticed. Two tiers:
#
# - Pull requests (fast): lint, types, generated files, the full test suite with the browser tests
#   required (never skipped), the Dashboard's type check and JavaScript tests, a clean rebuild of
#   the Graph workspace compared with what is committed, the oldest dependencies the package
#   allows, and the built wheel installed and run in a fresh environment.
# - Releases (wide): the test suite on Linux, macOS and Windows, on the oldest and newest Python the
#   package supports. Run on a version tag (v*), or by hand from the Actions tab.
#
# Each job writes what it ran with (platform, Python, dependency versions) to its summary, so a
# release can say exactly which platforms and dependency sets passed.

name: Checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      wide:
        description: Also run the release tier (every platform and Python)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  # A missing browser fails the browser tests here, never skips them (tests/fixtures/dashboard_browser.py).
  INGENCE_BROWSER_REQUIRED: "1"

jobs:
  lint:
    name: Lint, types and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -c tools/ci-constraints.txt -e ".[dev,content,browser]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy src/ingence
      - name: Generated files are current
        run: |
          python tools/export_schemas.py --check
          python tools/generate_web_types.py --check
          python tools/write_pack_digests.py --check

  tests:
    name: Tests (Linux, Python 3.12, browsers required)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install -c tools/ci-constraints.txt -e ".[dev,content,browser]"
          python -m playwright install --with-deps chromium
          npm ci
      - name: Record what ran
        run: |
          {
            echo "### Tests"
            echo "- Platform: $(uname -sr)"
            echo "- Python: $(python --version)"
            echo '```'
            python -m pip freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pytest
        run: python -m pytest -q

  dashboard:
    name: Dashboard types, JavaScript tests and the Graph workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Type check
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
      - name: JavaScript tests
        run: node --test tests/web_js/*.test.mjs
      - name: The committed Graph workspace is what its sources build
        working-directory: explorer
        run: |
          npm ci
          npm run build
      - name: Nothing changed
        run: |
          git status --porcelain -- src/ingence/web/explorer
          test -z "$(git status --porcelain -- src/ingence/web/explorer)" || {
            echo "::error::src/ingence/web/explorer differs from a clean build of explorer/. Run npm ci and npm run build in explorer/ and commit what changes."
            git diff --stat -- src/ingence/web/explorer
            exit 1
          }

  minimum:
    name: Oldest allowed dependencies (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the lower bound of every dependency
        run: |
          python -m pip install -c tools/minimum-constraints.txt -e ".[content]"
          python -m pip install pytest hypothesis
      - name: Record what ran
        run: |
          {
            echo "### Oldest allowed dependencies"
            echo '```'
            python -m pip freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The installed command works
        run: python tools/smoke_installed.py
      - name: Pytest (no browser)
        run: python -m pytest -q --ignore-glob="tests/test_browser*"
        env:
          INGENCE_BROWSER_REQUIRED: "0"

  wheel:
    name: The built wheel, installed fresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install into an empty environment and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/python tools/smoke_installed.py --command /tmp/wheel-env/bin/ingence

  wide:
    name: Release tier (${{ matrix.os }}, Python ${{ matrix.python }})
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.wide)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        shell: bash
        run: |
          python -m pip install -c tools/ci-constraints.txt -e ".[dev,content,browser]"
          python -m playwright install --with-deps chromium
          npm ci
      - name: Record what ran
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}, Python ${{ matrix.python }}"
            echo '```'
            python -m pip freeze
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pytest
        run: python -m pytest -q
      - name: The installed command works
        run: python tools/smoke_installed.py
